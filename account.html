  <style>
    .account-section { margin-top: 22px; }
    .account-section h2 { margin-bottom: 14px; }
    .account-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .account-pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
    .account-page-label { font-size: 12px; color: var(--text3, #8b90a0); }
    .account-page-btn:disabled { opacity: .4; cursor: default; }
    @media (max-width: 720px) { .account-columns { grid-template-columns: 1fr; } }
    .account-avatar-circle {
      position: relative; display: block; flex-shrink: 0;
      width: 58px; height: 58px; border-radius: 50%; overflow: hidden; cursor: pointer;
    }
    .account-avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--dark2, #12141b); display: flex; align-items: center; justify-content: center; }
    .account-avatar-placeholder { color: var(--text3, #8b90a0); padding: 13px; box-sizing: border-box; }
    .account-avatar-placeholder svg { width: 100%; height: 100%; }
    .account-avatar-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(5, 6, 10, .68); color: #fff;
      font-family: var(--font-m); font-size: 9.5px; letter-spacing: .5px; text-transform: uppercase;
      opacity: 0; transition: opacity var(--transition, .2s);
    }
    .account-avatar-circle:hover .account-avatar-overlay { opacity: 1; }
    .account-avatar-status { font-size: 12px; color: var(--text3, #8b90a0); margin: 4px 0 0; }
    .account-avatar-status:empty { display: none; }
    .account-avatar-status.ok { color: #5fd97a; }
  </style>
